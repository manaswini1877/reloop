AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ReLoop backend – Phase 4 (Hardened analyze pipeline, safety fallback, demo cache, API throttling, gateway CORS)

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  BedrockModelId:
    Type: String
    Default: ""
    Description: >
      Bedrock model ID used by the /analyze function (Phase 2).
      Leave empty for Phase 1.
  UseMock:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: When "true" the /analyze function returns mock data (Phase 2).

# ---------------------------------------------------------------------------
# Globals – applied to every AWS::Serverless::Function unless overridden
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        BUCKET_NAME: !Ref ImageBucket
        TABLE_NAME: !Ref ItemsTable
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        USE_MOCK: !Ref UseMock

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # ── S3 bucket ─────────────────────────────────────────────────────────────
  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Block every form of public access
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      # CORS – allows the browser to PUT directly to S3 and read objects.
      # TODO: tighten AllowedOrigins to your production domain before going live.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedOrigins:
              - "*"
            AllowedHeaders:
              - "*"
            MaxAge: 3600

      # Lifecycle – auto-delete raw uploads after 30 days to limit storage costs.
      LifecycleConfiguration:
        Rules:
          - Id: expire-uploads-30-days
            Status: Enabled
            Prefix: "uploads/"
            ExpirationInDays: 30

  # ── DynamoDB table ────────────────────────────────────────────────────────
  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── API Gateway (REST) ────────────────────────────────────────────────────
  ReloopApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
      MethodSettings:
        # Cost guard: throttle POST /analyze to prevent runaway calls or costs
        - ResourcePath: "/analyze"
          HttpMethod: "POST"
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type'"

  # ── /upload-url Lambda ────────────────────────────────────────────────────
  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      CodeUri: functions/upload_url/
      Description: Returns a presigned S3 PUT URL for direct browser upload.
      Events:
        UploadUrlPost:
          Type: Api
          Properties:
            RestApiId: !Ref ReloopApi
            Path: /upload-url
            Method: POST
      Policies:
        # Allow only PutObject under the uploads/ prefix – nothing else.
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "arn:aws:s3:::${ImageBucket}/uploads/*"

  # ── GET /items Lambda ─────────────────────────────────────────────────────
  ListItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      CodeUri: functions/list_items/
      Description: Returns all items from DynamoDB, sorted newest first (up to 100).
      Events:
        ListItemsGet:
          Type: Api
          Properties:
            RestApiId: !Ref ReloopApi
            Path: /items
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ItemsTable

  # ── GET /items/{id} Lambda ────────────────────────────────────────────────
  GetItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      CodeUri: functions/get_item/
      Description: Returns a single item by id from DynamoDB.
      Events:
        GetItemGet:
          Type: Api
          Properties:
            RestApiId: !Ref ReloopApi
            Path: /items/{id}
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ItemsTable

  # ── POST /analyze Lambda ──────────────────────────────────────────────────
  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      CodeUri: functions/analyze/
      Description: Analyzes an uploaded e-waste image via Bedrock or mock mode.
      Timeout: 28
      MemorySize: 512
      Events:
        AnalyzePost:
          Type: Api
          Properties:
            RestApiId: !Ref ReloopApi
            Path: /analyze
            Method: POST
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${ImageBucket}/uploads/*"
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt ItemsTable.Arn
            # Cross-region inference profiles need several resource ARNs; this is a hackathon simplification to tighten later.
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  ApiUrl:
    Description: Base URL for the ReLoop REST API (prod stage)
    Value: !Sub "https://${ReloopApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  BucketName:
    Description: Name of the S3 bucket that stores uploaded images
    Value: !Ref ImageBucket

  TableName:
    Description: Name of the DynamoDB table that stores Item records
    Value: !Ref ItemsTable
